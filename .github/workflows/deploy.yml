name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Navigateur pour les tests
        run: npx playwright install --with-deps chromium

      - name: Tests dans le navigateur (Playwright)
        run: npm run test:e2e

      - name: Rapport des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build (chemin du site fourni par GitHub Pages, ex. /mathgaret/)
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
